# Hardware watchdog: systemd pings /dev/watchdog (BCM2835) regularly; if the system
# hangs and stops pinging, the SoC watchdog hard-resets the Pi. This is what recovers a
# fully-frozen device with no SSH/screen. Installed to /etc/systemd/system.conf.d/.
[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=2min
