# Dashboard runtime config.
# Copy this to the writable data partition on the Pi as config.yaml and fill in.
# The real config.yaml is gitignored and must NEVER be committed (it holds secrets).
#
# Location can also be pushed at runtime via:  POST /api/location  (see README).

# --- Where the dashboard thinks it is (no GPS on the Pi) ---
location:
  label: "Home"
  lat: 51.5074          # default; London. Override per-device.
  lon: -0.1278
  timezone: "Europe/London"

# --- Units ---
units:
  temperature: "celsius"     # celsius | fahrenheit
  wind: "kmh"                # kmh | mph | ms | kn
  distance: "nm"             # nm | km | mi  (aircraft distances)

# --- Home page world clocks (carousel; IANA timezone names) ---
world_clocks:
  - { label: "Los Angeles", tz: "America/Los_Angeles" }
  - { label: "Chicago",     tz: "America/Chicago" }
  - { label: "Paris",       tz: "Europe/Paris" }
  - { label: "Bucharest",   tz: "Europe/Bucharest" }
  - { label: "Mumbai",      tz: "Asia/Kolkata" }
  - { label: "Hong Kong",   tz: "Asia/Hong_Kong" }

# --- Home page countdown tile (whole days until dated events; cycles if several) ---
countdowns:
  - { label: "Bali", date: "2026-09-26", emoji: "🏝️" }

# --- Home page stocks/indices ticker (Yahoo Finance symbols) ---
stocks:
  enabled: true
  symbols:
    - { symbol: "^FTSE", label: "FTSE 100" }
    - { symbol: "^GSPC", label: "S&P 500" }
    - { symbol: "^IXIC", label: "NASDAQ" }
    - { symbol: "GC=F",  label: "Gold" }
    - { symbol: "CL=F",  label: "Oil (WTI)" }

# --- National Rail Darwin OpenLDBWS (SOAP) ---
trains:
  enabled: true
  token: "PUT-YOUR-DARWIN-TOKEN-HERE"   # legacy OpenLDBWS token
  station_crs: "KGX"                     # origin station 3-letter CRS code
  destination_crs: ""                    # optional filter, e.g. "CBG"; blank = all
  rows: 10                               # number of departures to fetch

# --- Aircraft (airplanes.live) ---
aircraft:
  enabled: true
  radius_nm: 50          # search radius around location
  max_results: 12        # nearest N returned to the UI

# --- Radar (RainViewer) ---
radar:
  forecast_zoom: 7       # tile zoom to sample rain over your location (RainViewer caps at 7)

# --- Govee Wi-Fi thermo-hygrometer (indoor temp/humidity) ---
govee:
  enabled: false
  api_key: ""            # Govee Home app -> Settings -> Apply for API Key
  sku: ""                # device model, e.g. "H5179"  (see GET /api/govee/devices)
  device: ""             # device id/MAC          (see GET /api/govee/devices)
  reports_fahrenheit: true   # Govee sensors report °F; converted to your units.
                             # When enabled, the live reading overrides the headline
                             # temperature + humidity (Open-Meteo is only an estimate).

# --- Custom trackers (the "watch this thing" app) ---
trackers:
  interval_seconds: 3600    # how often auto trackers (holiday/DVLA) re-poll (default 1h)

# TUI holiday price, read from Holiday Hypermarket (TUI-owned, same prices, no bot-wall).
# Capture the search_id once: open the Holiday Hypermarket hotel page, run your exact
# search, devtools -> Network -> the "Results/GetResults" request -> read "searchId"
# (and "accountId") from its JSON request body.
holiday_tracker:
  enabled: false
  search_id: 0              # numeric searchId from the GetResults request body
  account_id: ""            # accountId from the same request body
  accommodation_id: 0       # hotel id to match exactly (0 = take first/cheapest result)
  price_field: "pricePp"    # pricePp = per-person (matches TUI headline) | price = party total

# DVLA driving-licence status (GOV.UK "View your driving licence"). A status tracker:
# alerts when the licence status text or validity dates change (e.g. a medical renewal
# completing). Details are sensitive identity info — keep this file gitignored, Pi-only.
dvla_licence:
  enabled: false
  licence_number: ""        # 16-char DVLA driving licence number
  national_insurance: ""    # National Insurance number
  postcode: ""              # postcode on the licence

# --- EcoFlow solar output (official developer API) ---
# Apply at developer-eu.ecoflow.com, generate an Access Key + Secret Key. Newer devices
# (e.g. the STREAM microinverter) only push live data over EcoFlow's MQTT broker, so the
# backend runs a small MQTT subscriber; solar output = sum of the PV-input watts.
ecoflow:
  enabled: false
  access_key: ""
  secret_key: ""
  serial: ""            # device serial (SN); leave blank to auto-pick the first device
  pv_field: ""          # optional: override which quota field holds solar input watts

# --- Second Govee sensor, placed indoors (the first `govee` is the outdoor/local one) ---
# Same Govee account/api_key; just a different device. Drives the home-strip Indoor tile.
govee_indoor:
  enabled: false
  api_key: ""           # same key as `govee` above is fine
  sku: ""               # device model (see GET /api/govee/devices)
  device: ""            # device id/MAC
  reports_fahrenheit: true

# --- Parcel tracking (Parcel.app) ---
# Deliveries are managed in the Parcel app; the dashboard just READS your active/recent
# ones and shows a card per delivery. Add/remove parcels in the app (web.parcelapp.net),
# not here. Generate an API key at web.parcelapp.net -> API and paste it below.
# The endpoint is cached upstream and rate-limited to 20 requests/hour (we cache 15 min).
parcel_api:
  provider: "parcelapp"
  api_key: ""           # api-key header value from web.parcelapp.net (Pi-only/gitignored)

# --- Cache TTLs (seconds) ---
cache:
  weather: 600
  radar: 120
  aircraft: 5            # upstream is also throttled to >=1 req/sec
  trains: 30
  stocks: 300
  news: 900             # BBC UK+World headlines
  facts: 3600           # random trivia (Useless Facts API)
  indoor: 60            # Govee thermo-hygrometer poll
  air: 1800             # air quality / UV / pollen (Open-Meteo)
  solar: 60             # EcoFlow solar output

# --- Frontend refresh intervals (seconds) ---
refresh:
  weather: 600
  radar: 120
  aircraft: 20
  trains: 30
  stocks: 300
  clock: 1

# --- Admin token: required to POST changes to location/settings ---
# Generate something random; the frontend settings page uses it.
admin_token: "change-me"

# --- HTTP server ---
server:
  host: "127.0.0.1"
  port: 8080
